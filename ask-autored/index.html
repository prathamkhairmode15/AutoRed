<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoRed | Ask AutoRed</title>
  <link rel="stylesheet" href="../dashboard/style.css" />
  <script>
    // Apply theme early to prevent flicker
    const savedTheme = localStorage.getItem("theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>

<body>
  <div class="app-container">
    <!-- Top Navigation Bar -->
    <nav class="top-navbar">
      <div class="nav-logo pixel-font" style="font-size: 1.5rem; cursor: pointer;" onclick="window.location.href='../dashboard/index.html'">Auto<span style="color: #ff0404;">Red</span> <span>APT</span></div>
      <div class="nav-user">
        <button id="theme-toggle" class="theme-toggle">THEME: DARK</button>
        <span id="user-display" class="sub-pixel-font">Authenticating...</span>
        <a href="../settings/index.html" class="icon-btn" title="Settings" style="text-decoration:none;">⚙</a>
        <button id="logout-btn" class="logout-link" title="Logout"
          style="background:none; border:none; cursor:pointer; color: var(--text-secondary); display:flex; align-items:center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" style="width: 20px; height: 20px;">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </nav>

    <div class="main-wrapper">
      <!-- Left Sidebar Navigation -->
      <aside class="sidebar">
        <a href="../dashboard/index.html" class="sidebar-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="sidebar-icon">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span class="sub-pixel-font">Dashboard</span>
        </a>
        <a href="../new-scan/index.html" class="sidebar-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="sidebar-icon">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          <span class="sub-pixel-font">New Scan</span>
        </a>
        <a href="../scan-history/index.html" class="sidebar-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="sidebar-icon">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="sub-pixel-font">Scan History</span>
        </a>
        <a href="../reports/index.html" class="sidebar-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="sidebar-icon">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span class="sub-pixel-font">Reports</span>
        </a>
        <a href="../settings/index.html" class="sidebar-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="sidebar-icon">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
          <span class="sub-pixel-font">Settings</span>
        </a>
        <a href="../ask-autored/index.html" class="sidebar-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="sidebar-icon">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="sub-pixel-font">Ask AutoRed</span>
        </a>

      </aside>

      <!-- Main Dashboard Content Area -->
      <main class="content-area" style="display: flex; flex-direction: column; overflow: hidden; padding: 0;">
        <div class="dashboard-header"
          style="padding: 2rem 2rem 1rem 2rem; border-bottom: 1px solid var(--border-color); flex-shrink: 0;">
          <h2 class="pixel-font" style="font-size: 1.2rem; color: var(--accent-color);">Ask AutoRed AI</h2>
          <p class="sub-pixel-font" style="color: var(--text-secondary)">Powered by Llama 3</p>
        </div>

        <div id="chat-history" class="chat-history"
          style="flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;">
          <div class="chat-message bot" style="align-self: flex-start; max-width: 80%;">
            <div class="chat-bubble"
              style="background: var(--box-bg); padding: 1.5rem; border-radius: var(--border-radius); border: 1px solid var(--border-color);">
              <span class="pixel-font"
                style="color: var(--accent-color); display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">AutoRed</span>
              <div style="color: var(--text-primary); line-height: 1.6;">Hello! I am AutoRed APT, your local
                cybersecurity AI assistant. How can I help you today?</div>
            </div>
          </div>
        </div>

        <div class="chat-input-area"
          style="padding: 1.5rem 2rem; background: var(--bg-color); border-top: 1px solid var(--border-color); flex-shrink: 0;">
          <form id="chat-form" style="display: flex; gap: 1rem;">
            <input type="text" id="chat-input" placeholder="Ask anything..." autocomplete="off"
              style="flex: 1; padding: 1rem 1.5rem; border-radius: 30px; border: 1px solid var(--border-color); background: var(--box-bg); color: var(--text-primary); font-family: 'IBM Plex Mono', monospace; font-size: 1rem; outline: none; transition: border-color 0.3s ease;"
              required />
            <button type="submit" class="btn-primary"
              style="border-radius: 30px; padding: 1rem 2rem; display: flex; align-items: center; justify-content: center; min-width: 80px;">
              <span id="btn-text">Send</span>
            </button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script type="module" src="app.js"></script>

  <style>
    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.2rem;
      transition: color 0.3s ease;
    }

    .icon-btn:hover {
      color: var(--accent-color);
    }
  </style>
</body>

</html>
